<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --ink-900:#0B1521; --ink-800:#12212F; --ink-700:#1B3040; --ink-600:#2A4356;
  --slate-500:#5B7286; --slate-400:#8298AB; --slate-300:#B4C4D1; --slate-200:#DCE5EC; --slate-100:#EDF2F6;
  --paper:#F6F8FA; --card:#FFFFFF;
  --teal-600:#0B6E77; --teal-500:#0E8A95; --teal-400:#22A7B3; --teal-050:#E4F4F6;
  --amber-500:#C77A0A; --amber-050:#FBF0DC;
  --rose-600:#B3282E; --rose-050:#FBE7E8;
  --green-600:#1E7A4C; --green-050:#E3F3EA;
  --violet-500:#5B4BC4; --violet-050:#EDEAFA;

  --bg:var(--paper); --surface:var(--card); --surface-2:var(--slate-100);
  --text:var(--ink-900); --text-2:var(--slate-500); --text-3:var(--slate-400);
  --line:var(--slate-200); --line-strong:var(--slate-300);
  --accent:var(--teal-600); --accent-soft:var(--teal-050); --accent-text:#fff;
  --shadow-sm:0 1px 2px rgba(11,21,33,.06),0 1px 3px rgba(11,21,33,.04);
  --shadow-md:0 2px 6px rgba(11,21,33,.07),0 8px 24px rgba(11,21,33,.06);
  --shadow-lg:0 12px 40px rgba(11,21,33,.16);
  --r-sm:6px; --r:10px; --r-lg:14px; --r-xl:20px;
  --sans:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;
  --sidebar-w:248px;
}
[data-theme="dark"]{
  --bg:#070E16; --surface:#0F1B27; --surface-2:#162634;
  --text:#E8EFF5; --text-2:#93A8B9; --text-3:#6B8091;
  --line:#1E3243; --line-strong:#2A4356;
  --accent:#22A7B3; --accent-soft:#0C2B31; --accent-text:#04161A;
  --teal-050:#0C2B31; --amber-050:#2E2413; --rose-050:#2E1618; --green-050:#0F2A1D; --violet-050:#1E1B3A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 8px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.3);
  --shadow-lg:0 16px 48px rgba(0,0,0,.55);
}
[data-theme="dark"]{ --amber-500:#E0A63C; --rose-600:#EE6B70; --green-600:#48BE82; --violet-500:#9E8FF0; }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.3;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ AUTH SCREENS ============ */
.auth-wrap{min-height:100dvh;display:grid;grid-template-columns:1.05fr .95fr}
@media(max-width:900px){.auth-wrap{grid-template-columns:1fr}.auth-aside{display:none!important}}
.auth-aside{background:var(--ink-900);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-aside::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--ink-700) 1px,transparent 1px),linear-gradient(90deg,var(--ink-700) 1px,transparent 1px);background-size:34px 34px;opacity:.42;mask-image:radial-gradient(ellipse at 30% 40%,#000 10%,transparent 72%)}
.auth-aside>*{position:relative;z-index:1}
.brand-mark{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand-glyph{width:34px;height:34px;border-radius:9px;flex:none;object-fit:contain;background:#fff;padding:3px}
.auth-aside h2{font-size:31px;line-height:1.28;font-weight:600;max-width:15ch;letter-spacing:-.025em}
.auth-aside p{color:var(--slate-300);max-width:38ch;margin:14px 0 0;font-size:14px}
.runway-demo{margin-top:34px;display:flex;flex-direction:column;gap:15px;max-width:330px}
.rd-row{display:flex;flex-direction:column;gap:6px}
.rd-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--slate-400);letter-spacing:.04em;text-transform:uppercase}
.rd-track{height:7px;border-radius:99px;background:var(--ink-700);position:relative;overflow:hidden}
.rd-plan{position:absolute;inset-block:0;inset-inline-start:0;background:var(--slate-500);opacity:.5}
.rd-act{position:absolute;inset-block:0;inset-inline-start:0;background:var(--teal-400);border-radius:99px}
.auth-main{display:flex;align-items:center;justify-content:center;padding:32px 22px;background:var(--surface)}
.auth-card{width:100%;max-width:390px}
.auth-card h1{font-size:25px;margin-bottom:6px;letter-spacing:-.028em}
.auth-sub{color:var(--text-2);margin-bottom:26px;font-size:13.5px}
.auth-toggle{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:var(--r);margin-bottom:22px}
.auth-toggle button{flex:1;padding:9px;border:0;background:transparent;border-radius:7px;cursor:pointer;font-weight:500;color:var(--text-2);font-size:13.5px;transition:.15s}
.auth-toggle button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.auth-foot{margin-top:24px;text-align:center;font-size:12.5px;color:var(--text-3)}
.lang-float{position:absolute;top:20px;inset-inline-end:20px;display:flex;gap:6px;z-index:5}

/* ============ FORM ============ */
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:6px;letter-spacing:.015em}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--text);transition:.15s;font-size:14px}
.inp:hover{border-color:var(--line-strong)}
.inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:78px;line-height:1.6}
select.inp{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:32px}
[dir=rtl] select.inp{background-position:15px 50%,20px 50%}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;font-weight:500;transition:.15s;white-space:nowrap;font-size:13.5px}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn-primary:hover{filter:brightness(1.09);background:var(--accent);border-color:var(--accent)}
.btn-danger{color:var(--rose-600);border-color:var(--line)}
.btn-danger:hover{background:var(--rose-050);border-color:var(--rose-600)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-block{width:100%}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn-icon{padding:7px;width:32px;height:32px}

/* ============ APP SHELL ============ */
.app{display:none;min-height:100dvh}
.app.on{display:grid;grid-template-columns:var(--sidebar-w) 1fr}
.sidebar{background:var(--ink-900);color:var(--slate-300);display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;z-index:40}
.sb-head{padding:19px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ink-700)}
.sb-head .brand-mark{font-size:16px;color:#fff}
.sb-head .brand-glyph{width:29px;height:29px;border-radius:8px}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px}
.sb-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--slate-500);padding:14px 10px 6px;font-weight:600}
.sb-link{display:flex;align-items:center;gap:11px;padding:8.5px 11px;border-radius:8px;cursor:pointer;font-size:13.5px;transition:.13s;margin-bottom:2px;font-weight:400}
.sb-link:hover{background:var(--ink-700);color:#fff}
.sb-link.on{background:var(--teal-600);color:#fff;font-weight:500}
.sb-link svg{width:17px;height:17px;flex:none;opacity:.85}
.sb-link.on svg{opacity:1}
.sb-badge{margin-inline-start:auto;background:var(--rose-600);color:#fff;font-size:10.5px;padding:1px 6px;border-radius:99px;font-weight:600;min-width:18px;text-align:center}
.sb-foot{padding:11px;border-top:1px solid var(--ink-700)}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px;cursor:pointer;transition:.13s}
.sb-user:hover{background:var(--ink-700)}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--teal-500);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none}
.sb-user-info{min-width:0;flex:1}
.sb-user-name{font-size:13px;color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-role{font-size:11px;color:var(--slate-500)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hamburger{display:none}
.content{padding:22px 20px 60px;max-width:1440px;width:100%;margin:0 auto;flex:1}
@media(max-width:1000px){
  .app.on{grid-template-columns:1fr}
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:var(--sidebar-w);transform:translateX(-104%);transition:transform .22s}
  [dir=rtl] .sidebar{transform:translateX(104%)}
  .sidebar.open{transform:none!important}
  .hamburger{display:inline-flex}
  .content{padding:16px 14px 70px}
  .topbar{padding:0 14px}
}
.scrim{position:fixed;inset:0;background:rgba(7,14,22,.55);z-index:35;display:none}
.scrim.on{display:block}

/* ============ CARDS & LAYOUT ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:17px}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--line)}
.card-head h2,.card-head h3{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.row-wrap{flex-wrap:wrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--text-2)}
.tiny{font-size:12px}
.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--k,var(--accent))}
.kpi-label{font-size:11.5px;color:var(--text-2);font-weight:500;letter-spacing:.01em}
.kpi-value{font-size:27px;font-weight:600;font-family:var(--mono);letter-spacing:-.03em;line-height:1.15;margin-top:5px}
.kpi-sub{font-size:11.5px;color:var(--text-3);margin-top:2px}

/* ============ RUNWAY (signature) ============ */
.runway{display:flex;flex-direction:column;gap:5px}
.runway-track{position:relative;height:22px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.runway-plan{position:absolute;inset-block:0;inset-inline-start:0;background:repeating-linear-gradient(135deg,var(--line-strong) 0 4px,transparent 4px 8px);border-inline-end:1.5px dashed var(--slate-400)}
.runway-act{position:absolute;inset-block:3px;inset-inline-start:0;background:var(--accent);border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.runway-act.ahead{background:var(--green-600)}
.runway-act.warn{background:var(--amber-500)}
.runway-act.late{background:var(--rose-600)}
.runway-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap;line-height:1.6}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.b-gray{background:var(--surface-2);color:var(--text-2)}
.b-teal{background:var(--teal-050);color:var(--teal-600)}
.b-green{background:var(--green-050);color:var(--green-600)}
.b-amber{background:var(--amber-050);color:var(--amber-500)}
.b-rose{background:var(--rose-050);color:var(--rose-600)}
.b-violet{background:var(--violet-050);color:var(--violet-500)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-sm);background:var(--surface-2);font-size:11.5px;color:var(--text-2)}
.pri-dot{width:7px;height:7px;border-radius:2px;flex:none}

/* ============ TABLE ============ */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
table.tbl th{text-align:start;padding:9px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.075em;color:var(--text-3);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.tbl td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tbody tr{transition:.12s}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tbody tr:last-child td{border-bottom:0}
.cell-strong{font-weight:500}

/* ============ TABS ============ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;cursor:pointer;font-size:13.5px;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;transition:.13s;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(7,14,22,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px 14px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border-radius:var(--r-xl);width:100%;max-width:600px;box-shadow:var(--shadow-lg);margin:auto;animation:pop .18s cubic-bezier(.2,.9,.3,1.1)}
.modal.wide{max-width:880px}
.modal.slim{max-width:430px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}}
.modal-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-head h2{flex:1}
.modal-body{padding:20px;max-height:calc(100dvh - 210px);overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

/* ============ KANBAN ============ */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(228px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
@media(max-width:900px){.kanban{grid-template-columns:repeat(4,258px)}}
.kcol{background:var(--surface-2);border-radius:var(--r-lg);padding:10px;min-height:130px}
.kcol-head{display:flex;align-items:center;gap:7px;padding:2px 4px 10px;font-size:12.5px;font-weight:600}
.kcount{background:var(--surface);padding:0 7px;border-radius:99px;font-size:11px;color:var(--text-2);font-family:var(--mono)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:8px;cursor:pointer;transition:.13s;box-shadow:var(--shadow-sm)}
.kcard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kcard-title{font-weight:500;font-size:13px;margin-bottom:7px;line-height:1.45}

/* ============ GANTT ============ */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.gantt-inner{min-width:760px;position:relative}
.g-head{display:flex;position:sticky;top:0;background:var(--surface);z-index:3;border-bottom:1px solid var(--line)}
.g-label-col{width:212px;flex:none;padding:9px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.075em;color:var(--text-3);font-weight:600;border-inline-end:1px solid var(--line);background:var(--surface);position:sticky;inset-inline-start:0;z-index:4}
.g-scale{flex:1;display:flex;position:relative}
.g-tick{flex:1;text-align:center;font-size:10.5px;color:var(--text-3);padding:9px 2px;border-inline-start:1px solid var(--line);white-space:nowrap;overflow:hidden;font-family:var(--mono)}
.g-row{display:flex;border-bottom:1px solid var(--line);min-height:37px}
.g-row:hover{background:var(--surface-2)}
.g-row:last-child{border-bottom:0}
.g-label{width:212px;flex:none;padding:9px 13px;font-size:12.5px;border-inline-end:1px solid var(--line);display:flex;align-items:center;gap:7px;background:var(--surface);position:sticky;inset-inline-start:0;z-index:2;overflow:hidden}
.g-row:hover .g-label{background:var(--surface-2)}
.g-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-lane{flex:1;position:relative;padding:8px 0}
.g-grid{position:absolute;inset:0;display:flex;pointer-events:none}
.g-grid>i{flex:1;border-inline-start:1px solid var(--line)}
.g-bar{position:absolute;height:19px;border-radius:5px;top:9px;background:var(--accent);cursor:pointer;display:flex;align-items:center;padding:0 6px;font-size:10.5px;color:#fff;overflow:hidden;box-shadow:var(--shadow-sm);white-space:nowrap;transition:.15s}
.g-bar:hover{filter:brightness(1.15);z-index:5}
.g-bar-fill{position:absolute;inset-block:0;inset-inline-start:0;background:rgba(255,255,255,.32);border-radius:5px}
.g-bar span{position:relative;z-index:1}
.g-ms{position:absolute;top:8px;width:19px;height:19px;background:var(--violet-500);transform:rotate(45deg);border-radius:3px;cursor:pointer;box-shadow:var(--shadow-sm)}
.g-phase{background:var(--ink-600);height:11px;top:13px;border-radius:3px}
.g-today{position:absolute;inset-block:0;width:2px;background:var(--rose-600);z-index:2;pointer-events:none}
.g-today::before{content:"";position:absolute;top:0;inset-inline-start:-3px;width:8px;height:8px;border-radius:50%;background:var(--rose-600)}

/* ============ CALENDAR ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cal-dow{background:var(--surface-2);padding:8px 4px;text-align:center;font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em}
.cal-day{background:var(--surface);min-height:98px;padding:6px;font-size:12px;position:relative;transition:.12s}
.cal-day:hover{background:var(--surface-2)}
.cal-day.out{background:var(--bg);opacity:.5}
.cal-day.today .cal-num{background:var(--accent);color:var(--accent-text);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.cal-num{font-family:var(--mono);font-size:11.5px;color:var(--text-2);margin-bottom:4px;font-weight:500}
.cal-ev{font-size:10.5px;padding:2px 5px;border-radius:4px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
@media(max-width:700px){.cal-day{min-height:64px;padding:3px}.cal-ev{font-size:9px;padding:1px 3px}}

/* ============ CHECKLIST / LISTS ============ */
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:17px;height:17px;margin:2px 0 0;cursor:pointer;accent-color:var(--accent);flex:none}
.chk-text{flex:1;min-width:0;line-height:1.55}
.chk.done .chk-text{text-decoration:line-through;color:var(--text-3)}
.list-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.li-main{flex:1;min-width:0}
.li-title{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11.5px;color:var(--text-2);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ============ EMPTY / TOAST / MISC ============ */
.empty{text-align:center;padding:44px 20px;color:var(--text-2)}
.empty-glyph{width:46px;height:46px;margin:0 auto 13px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--text-3)}
.empty h3{margin-bottom:5px;color:var(--text)}
.empty p{font-size:13px;max-width:34ch;margin:0 auto 15px}
.toast-zone{position:fixed;bottom:20px;inset-inline-end:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 40px)}
.toast{background:var(--ink-900);color:#fff;padding:11px 15px;border-radius:var(--r);box-shadow:var(--shadow-lg);font-size:13.5px;animation:slidein .2s;max-width:360px}
.toast.err{background:var(--rose-600)}
.toast.ok{background:var(--green-600)}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}}
.loading{display:grid;place-items:center;padding:52px;color:var(--text-2)}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--line);margin:16px 0}
.pill-tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:var(--r);overflow-x:auto}
.pill-tabs button{padding:6px 12px;border:0;background:transparent;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--text-2);white-space:nowrap;font-weight:500}
.pill-tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

/* ============ AI PANEL ============ */
.ai-fab{position:fixed;bottom:22px;inset-inline-end:22px;width:52px;height:52px;border-radius:50%;background:var(--ink-900);color:#fff;border:0;cursor:pointer;box-shadow:var(--shadow-lg);display:grid;place-items:center;z-index:60;transition:.18s}
.ai-fab:hover{transform:scale(1.06)}
[data-theme=dark] .ai-fab{background:var(--accent);color:var(--accent-text)}
.ai-panel{position:fixed;bottom:0;inset-inline-end:0;width:400px;max-width:100vw;height:min(620px,100dvh);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow-lg);display:none;flex-direction:column;z-index:70}
.ai-panel.on{display:flex}
@media(max-width:520px){.ai-panel{height:100dvh;border-radius:0}}
.ai-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.ai-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.ai-msg{max-width:87%;padding:10px 13px;border-radius:var(--r-lg);font-size:13.5px;line-height:1.62;white-space:pre-wrap;word-wrap:break-word}
.ai-msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-text);border-end-end-radius:5px}
.ai-msg.a{align-self:flex-start;background:var(--surface-2);border-end-start-radius:5px}
.ai-suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ai-suggest button{padding:6px 11px;border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:12px;cursor:pointer;color:var(--text-2);transition:.13s}
.ai-suggest button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ai-foot{padding:11px;border-top:1px solid var(--line);display:flex;gap:8px}
.ai-foot .inp{flex:1}

.pending-box{max-width:430px;text-align:center;margin:auto}
.pending-glyph{width:62px;height:62px;border-radius:17px;background:var(--amber-050);color:var(--amber-500);display:grid;place-items:center;margin:0 auto 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}
</style>
</head>

        <div class="field" id="fIdentifier">

          </div>
        </div>

          <label data-i18n="password"></label>
          <input class="inp" id="iPass" type="password" autocomplete="current-password" required minlength="8">
        </div>
        <div class="field" id="fPassConfirm" style="display:none">
          <label data-i18n="confirmPassword"></label>
          <input class="inp" id="iPassConfirm" type="password" autocomplete="new-password" minlength="8">
        </div>
        <button class="btn btn-primary btn-block" id="authSubmit" type="submit" style="margin-top:6px"></button>
      </form>

/* ===================== AUTH CLIENT (Better Auth) ===================== */
const Auth = {
  session:null, jwt:null, jwtExp:0,

  _tok(){ return localStorage.getItem('kayan_tok'); },
  _setTok(t){ t ? localStorage.setItem('kayan_tok',t) : localStorage.removeItem('kayan_tok'); },

  async call(path, body, method){
    const h={'Content-Type':'application/json'};
    const t=this._tok(); if(t) h['Authorization']='Bearer '+t;
    const r=await fetch(CFG.AUTH_URL+path,{
      method: method || (body?'POST':'GET'),
      headers:h, credentials:'include',
      body: body?JSON.stringify(body):undefined
    });
    let d=null; try{ d=await r.json(); }catch(_){}
    if(!r.ok) throw new Error(d?.message || d?.error?.message || `Auth error ${r.status}`);
    return d;
  },

  async signUp(email,password,name){
    const d=await this.call('/sign-up/email',{email,password,name:name||email.split('@')[0]});
    if(d?.token) this._setTok(d.token);
    return d;
  },
  async signIn(email,password){
    const d=await this.call('/sign-in/email',{email,password});
    if(d?.token) this._setTok(d.token);
    return d;
  },
  async getSession(){
    try{
      const d=await this.call('/get-session');
      this.session = d?.user ? d : null;
      return this.session;
    }catch(_){ this.session=null; return null; }
  },
  async signOut(){
    try{ await this.call('/sign-out',{}); }catch(_){}
    this._setTok(null); this.session=null; this.jwt=null; this.jwtExp=0;
    localStorage.removeItem('kayan_ai');
  },
  /* JWT used by the Data API — cached until 60s before expiry */
  async token(){
    if(this.jwt && Date.now() < this.jwtExp-60000) return this.jwt;
    const d=await this.call('/token');
    const tok = d?.token || d?.jwt;
    if(!tok) throw new Error('No JWT returned by auth service');
    this.jwt=tok;
    try{
      const p=JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      this.jwtExp = p.exp ? p.exp*1000 : Date.now()+540000;
    }catch(_){ this.jwtExp = Date.now()+540000; }
    return this.jwt;
  }
};

/* ===================== DATA API CLIENT (PostgREST) ===================== */
const DB = {
  async req(path, {method='GET', body, prefer, headers={}} = {}){
    const tok = await Auth.token();
    const h = {'Authorization':'Bearer '+tok,'Content-Type':'application/json','Accept':'application/json',...headers};
    if(prefer) h['Prefer']=prefer;
    const r = await fetch(CFG.API_URL+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
    if(r.status===204) return null;
    const txt = await r.text();
    let data=null; if(txt){ try{ data=JSON.parse(txt); }catch(_){ data=txt; } }
    if(!r.ok){
      const m = data?.message || data?.hint || data?.details || `Request failed (${r.status})`;
      throw new Error(m);
    }
    return data;
  },
  select(t,q=''){ return this.req(`/${t}${q?('?'+q):''}`); },
  /* Unauthenticated call — used only to resolve username/phone -> email before sign-in.
     The lookup_login_identifier() function is SECURITY DEFINER and returns nothing
     but the matching email; it cannot be used to read any other profile data. */
  async rpcAnon(fn,args={}){
    const r = await fetch(CFG.API_URL+`/rpc/${fn}`,{
      method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify(args)
    });
    if(!r.ok) return null;
    const txt=await r.text(); if(!txt) return null;
    try{ return JSON.parse(txt); }catch(_){ return null; }
  },
  async insert(t,row){
    const d=await this.req(`/${t}`,{method:'POST',body:row,prefer:'return=representation'});
    return Array.isArray(d)?d[0]:d;
  },
  async update(t,id,patch){
    const d=await this.req(`/${t}?id=eq.${id}`,{method:'PATCH',body:patch,prefer:'return=representation'});
    return Array.isArray(d)?d[0]:d;
  },
  remove(t,id){ return this.req(`/${t}?id=eq.${id}`,{method:'DELETE'}); },
  rpc(fn,args={}){ return this.req(`/rpc/${fn}`,{method:'POST',body:args}); }
};

function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); }
function go(route, projectId=null, tab='overview'){
  S.route=route; S.projectId=projectId; S.projectTab=tab;
  const hash = projectId ? `#/project/${projectId}/${tab}` : `#/${route}`;
  if(location.hash!==hash) history.pushState(null,'',hash);
  render();
}
window.addEventListener('popstate', ()=>{ parseHash(); render(); });
function parseHash(){
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(h[0]==='project' && h[1]){ S.route='projects'; S.projectId=h[1]; S.projectTab=h[2]||'overview'; }
  else { S.route = h[0] || 'dashboard'; S.projectId=null; }
}

/* ===================== RENDER DISPATCH ===================== */
const VIEWS = {};
async function render(){
  buildNav();
  const v=$('#view');
  v.innerHTML='<div class="loading"><div class="spin"></div></div>';
  $('#topActions').innerHTML='';
  const key = S.projectId ? 'projectDetail' : S.route;
  $('#pageTitle').textContent = S.projectId ? '…' : T(S.route);
  try{
    const fn = VIEWS[key] || VIEWS.dashboard;
    await fn(v);
  }catch(e){
    console.error(e);
    v.innerHTML = `<div class="empty"><h3>${T('loadError')}</h3><p>${esc(e.message)}</p>
      <button class="btn" onclick="render()">${T('recheck')}</button></div>`;
  }
}
function topAction(html, onClick){
  const b=document.createElement('button');
  b.className='btn btn-primary btn-sm'; b.innerHTML=html; b.onclick=onClick;
  $('#topActions').appendChild(b);
}

/* ===================== EMPTY STATE ===================== */
function emptyState(title, body, actionLabel, onAction){
  const id='e'+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{ const b=$('#'+id); if(b&&onAction) b.onclick=onAction; },0);
  return `<div class="empty">
    <div class="empty-glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></div>
    <h3>${esc(title)}</h3><p>${esc(body)}</p>
    ${actionLabel?`<button class="btn btn-primary" id="${id}">${esc(actionLabel)}</button>`:''}
  </div>`;
}

/* ===================== RUNWAY WIDGET (signature) ===================== */
function runway(actual, planned, opts={}){
  const a = Math.max(0,Math.min(100, actual||0));
  const p = planned==null ? null : Math.max(0,Math.min(100, planned));
  const v = p==null ? 0 : a-p;
  const cls = p==null ? '' : v>=0 ? 'ahead' : v>=-10 ? '' : v>=-20 ? 'warn' : 'late';
  return `<div class="runway">
    <div class="runway-track">
      ${p!=null?`<i class="runway-plan" style="width:${p}%"></i>`:''}
      <i class="runway-act ${cls}" style="width:${a}%"></i>
    </div>
    <div class="runway-legend">
      <span>${T('actual')} <b class="num">${a}%</b></span>
      ${p!=null?`<span>${T('planned')} <b class="num">${p}%</b> · ${T('variance')} <b class="num" style="color:${v>=0?'var(--green-600)':'var(--rose-600)'}">${v>0?'+':''}${v}</b></span>`:'<span></span>'}
    </div>
  </div>`;
}
const healthBadge = h => badge(h==='on_track'?'on_track':h==='delayed'?'delayed':'at_risk',
  h==='on_track'?T('onTrack'):h==='delayed'?T('delayed'):T('atRisk'));
</script>
<script>
/* ===================== DASHBOARD ===================== */
VIEWS.dashboard = async (v)=>{

        <div class="card-pad">${
          projects.length ? projects.map(p=>{
            const h=hMap[p.id]||{actual_progress:0,planned_progress:null,health:'on_track'};

      <div class="stack">
        <div class="card">
          <div class="card-head"><h3>${T('upcomingMeetings')}</h3></div>
          <div class="card-pad">${
            d.upcoming_meetings.length ? d.upcoming_meetings.map(m=>`
              <div class="list-item"><div class="li-main">
                <div class="li-title">${esc(m.title)}</div>
                <div class="li-sub"><span>${fmtDate(m.meeting_date)}</span>${m.start_time?`<span class="num">${m.start_time.slice(0,5)}</span>`:''}${m.project_name?`<span class="chip">${esc(m.project_name)}</span>`:''}</div>
              </div></div>`).join('')
            : `<p class="muted tiny" style="text-align:center;padding:14px 0">${T('noMeetings')}</p>` }
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>${T('upcomingMilestones')}</h3></div>
          <div class="card-pad">${
            d.upcoming_milestones.length ? d.upcoming_milestones.map(m=>`
              <div class="list-item"><div class="li-main">
                <div class="li-title">◆ ${esc(m.title)}</div>
                <div class="li-sub"><span>${fmtDate(m.due_date)}</span><span class="chip">${esc(m.project_name)}</span></div>
              </div></div>`).join('')
            : `<p class="muted tiny" style="text-align:center;padding:14px 0">${T('noMilestones')}</p>` }
          </div>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="dash-grid">
      <div class="card">
        <div class="card-head"><h3>${T('dueReminders')}</h3>
          <button class="btn btn-sm btn-ghost" onclick="go('reminders')">${T('all')} →</button></div>
        <div class="card-pad">${
          d.due_reminders.length ? d.due_reminders.map(r=>`
            <div class="list-item">
              <span class="pri-dot" style="background:${PRI_COLOR[r.priority]}"></span>
              <div class="li-main"><div class="li-title">${esc(r.title)}</div>
              <div class="li-sub">${fmtDateTime(r.remind_at)}</div></div>
            </div>`).join('')
          : `<p class="muted tiny" style="text-align:center;padding:14px 0">${T('noReminders')}</p>` }
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>${T('recentActivity')}</h3></div>
        <div class="card-pad">${
          d.recent_activity.length ? d.recent_activity.map(a=>`
            <div class="list-item"><div class="li-main">
              <div class="li-title" style="font-weight:400">${esc(a.description||a.action)}</div>
              <div class="li-sub">${fmtDateTime(a.created_at)}</div></div></div>`).join('')
          : `<p class="muted tiny" style="text-align:center;padding:14px 0">${T('noData')}</p>` }
        </div>
      </div>

  </div>
  <style>@media(max-width:960px){.dash-grid{grid-template-columns:1fr!important}}</style>`;

  $$('.proj-row').forEach(r => r.querySelector('.row').onclick = ()=>go('projects', r.dataset.id));

/* ===================== MY DAY ===================== */
VIEWS.myDay = async (v)=>{
  const rows = await DB.select('v_my_day','select=*&order=due_date.asc,priority.desc');
  const groups = {overdue:[],today:[],upcoming:[]};
  rows.forEach(r=>groups[r.bucket].push(r));

  if(!rows.length){ v.innerHTML = emptyState(T('myDayEmpty'), T('myDayEmptyBody')); return; }

  const section = (key,color)=>{
    const list=groups[key]; if(!list.length) return '';
    return `<div class="card">
      <div class="card-head"><span class="badge ${color}">${T(key)}</span><h3 style="flex:1"></h3>
        <span class="tiny muted num">${list.length}</span></div>
      <div class="card-pad" style="padding-top:4px;padding-bottom:4px">${list.map(t=>`
        <div class="chk" data-task="${t.id}">
          <input type="checkbox" class="md-chk">
          <div class="chk-text">
            <div style="font-weight:500">${esc(t.title)}</div>
            <div class="li-sub">
              <span class="chip" style="cursor:pointer" data-proj="${t.project_id}">
                <span style="width:6px;height:6px;border-radius:2px;background:${esc(t.project_color||'#2563eb')};display:inline-block"></span>
                ${esc(t.project_name)}</span>
              <span>${fmtDate(t.due_date)}</span>
              ${t.assignee?`<span>· ${esc(t.assignee)}</span>`:''}
              ${t.progress?`<span class="num">· ${t.progress}%</span>`:''}
            </div>
          </div>
          <span class="pri-dot" style="background:${PRI_COLOR[t.priority]}" title="${T(t.priority)}"></span>
        </div>`).join('')}
      </div></div>`;
  };

  v.innerHTML = `<div class="stack">
    <div class="row"><h2 style="flex:1">${T('myDayTitle')}</h2>
      <span class="tiny muted num">${rows.length} ${T('openTasks')}</span></div>
    ${section('overdue','b-rose')}${section('today','b-teal')}${section('upcoming','b-gray')}
  </div>`;

  $$('.md-chk').forEach(cb => cb.onchange = async ()=>{
    const id = cb.closest('[data-task]').dataset.task;
    cb.disabled=true;
    try{
      await DB.update('tasks', id, {status:'completed'});
      const row = rows.find(r=>r.id===id);
      await logActivity('task','completed',`${T('completed')}: ${row?.title||''}`, row?.project_id, id);
      toast(T('savedOk'),'ok'); render();
    }catch(e){ toast(e.message,'err'); cb.disabled=false; cb.checked=false; }
  });
  $$('[data-proj]').forEach(c => c.onclick = e=>{ e.stopPropagation(); go('projects', c.dataset.proj); });
};

/* ===================== PROJECTS LIST ===================== */
VIEWS.projects = async (v)=>{
  topAction(`+ ${T('newProject')}`, ()=>projectForm());
  const showArchived = S.cache.archived || false;
  const [list, health] = await Promise.all([
    DB.select('projects',`select=*&is_archived=eq.${showArchived}&order=created_at.desc`),
    DB.select('v_project_health','select=*')
  ]);
  S.projects=list;
  const hMap = Object.fromEntries(health.map(h=>[h.project_id,h]));

  if(!list.length && !showArchived){
    v.innerHTML = emptyState(T('noProjects'), T('noProjectsBody'), T('newProject'), ()=>projectForm());
    return;
  }

  v.innerHTML = `<div class="stack">
    <div class="row row-wrap">
      <input class="inp" id="pSearch" placeholder="${T('searchProjects')}" style="max-width:280px">
      <select class="inp" id="pStatus" style="max-width:170px">
        <option value="">${T('allStatuses')}</option>
        ${OPT.projectStatus().map(o=>`<option value="${o.v}">${o.t}</option>`).join('')}
      </select>
      <div class="spacer"></div>
      <button class="btn btn-sm ${showArchived?'btn-primary':''}" id="pArch">${T('archived')}</button>
    </div>
    <div id="pGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:14px"></div>
  </div>`;

  const draw=()=>{
    const q=$('#pSearch').value.toLowerCase(), st=$('#pStatus').value;
    const rows = list.filter(p =>
      (!q || (p.name+' '+(p.code||'')+' '+(p.client||'')).toLowerCase().includes(q)) &&
      (!st || p.status===st));
    $('#pGrid').innerHTML = rows.length ? rows.map(p=>{
      const h=hMap[p.id]||{actual_progress:0,planned_progress:null,health:'on_track',open_tasks:0,overdue_tasks:0,total_tasks:0};
      return `<div class="card card-pad" style="cursor:pointer" data-open="${p.id}">
        <div class="row" style="margin-bottom:10px">
          <span style="width:9px;height:9px;border-radius:3px;background:${esc(p.color||'#2563eb')};flex:none"></span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</div>
            ${p.code||p.client?`<div class="tiny muted">${esc([p.code,p.client].filter(Boolean).join(' · '))}</div>`:''}
          </div>
          ${badge(p.status)}
        </div>
        ${runway(h.actual_progress,h.planned_progress)}
        <div class="row row-wrap tiny muted" style="margin-top:11px;gap:12px">
          <span>${h.total_tasks} ${T('tasks')}</span>
          ${h.overdue_tasks?`<span style="color:var(--rose-600)">${h.overdue_tasks} ${T('overdue')}</span>`:''}
          <div class="spacer"></div>
          ${p.end_date?`<span>${fmtDate(p.end_date)}</span>`:''}
          ${healthBadge(h.health)}
        </div>
      </div>`;
    }).join('') : `<p class="muted" style="grid-column:1/-1;text-align:center;padding:32px">${T('noData')}</p>`;
    $$('[data-open]').forEach(c => c.onclick = ()=>go('projects', c.dataset.open));
  };
  $('#pSearch').oninput=draw; $('#pStatus').onchange=draw;
  $('#pArch').onclick=()=>{ S.cache.archived=!showArchived; render(); };
  draw();
};

/* ===================== PROJECT FORM ===================== */
async function projectForm(p=null){
  const isNew=!p;
  Modal.open({
    wide:true,
    title: isNew?T('newProject'):T('editProject'),
    body:`
      <div class="grid-2">
        ${field('fpName',T('projectName'),'text',p?.name,'required')}
        ${field('fpCode',T('projectCode'),'text',p?.code)}
        ${field('fpClient',T('client'),'text',p?.client)}
        ${field('fpPM',T('projectManager'),'text',p?.project_manager)}
        ${field('fpStart',T('startDate'),'date',p?.start_date)}
        ${field('fpEnd',T('endDate'),'date',p?.end_date)}
        ${field('fpBudget',T('budget'),'number',p?.budget,'step="0.01" min="0"')}
        ${field('fpColor',T('theme'),'color',p?.color||'#0B6E77')}
        ${selectField('fpPriority',T('priority'),OPT.priority(),p?.priority||'medium')}
        ${selectField('fpStatus',T('status'),OPT.projectStatus(),p?.status||'not_started')}
      </div>
      ${field('fpDesc',T('description'),'textarea',p?.description)}
      ${field('fpNotes',T('notes'),'textarea',p?.notes)}`,
    footer:`<button class="btn" data-close>${T('cancel')}</button>
            <button class="btn btn-primary" id="pSave">${isNew?T('create'):T('update')}</button>`
  });
  $('#pSave').onclick = async ()=>{
    const name=val('fpName');
    if(!name) return toast(T('requiredField'),'err');
    const row={
      owner_id:S.profile.id, name, code:valOrNull('fpCode'), client:valOrNull('fpClient'),
      project_manager:valOrNull('fpPM'), description:valOrNull('fpDesc'), notes:valOrNull('fpNotes'),
      start_date:valOrNull('fpStart'), end_date:valOrNull('fpEnd'), budget:numOrNull('fpBudget'),
      color:val('fpColor'), priority:val('fpPriority'), status:val('fpStatus')
    };
    try{
      $('#pSave').disabled=true;
      if(isNew){ const np=await DB.insert('projects',row); await logActivity('project','created',`${T('newProject')}: ${name}`, np.id, np.id); }
      else { await DB.update('projects',p.id,row); await logActivity('project','updated',`${T('editProject')}: ${name}`, p.id, p.id); }
      Modal.close(); toast(T('savedOk'),'ok'); render();
    }catch(e){ toast(e.message,'err'); $('#pSave').disabled=false; }
  };
}
</script>
<script>

    <div class="row row-wrap">
      <button class="btn btn-sm btn-ghost" onclick="go('projects')">← ${T('backToProjects')}</button>
      <div class="spacer"></div>
      ${badge(proj.status)} ${healthBadge(h.health)}

  const body=$('#pTabBody');
  const R = {overview:pOverview, tasks:pTasks, tracker:pTracker, timeline:pTimeline,
             milestones:pMilestones, meetings:pMeetings, risks:pRisks};
  await (R[S.projectTab]||pOverview)(body, proj, h);
};

/* ---------- OVERVIEW ---------- */
async function pOverview(el, p, h){
  const [tasks, ms, meets, risks] = await Promise.all([
    DB.select('tasks',`select=id,title,status,due_date,priority,progress&project_id=eq.${p.id}&order=due_date.asc&limit=200`),
    DB.select('milestones',`select=*&project_id=eq.${p.id}&order=due_date.asc`),
    DB.select('meetings',`select=*&project_id=eq.${p.id}&meeting_date=gte.${todayISO()}&order=meeting_date.asc&limit=5`),
    DB.select('risks',`select=*&project_id=eq.${p.id}&status=neq.closed&order=impact.desc`)
  ]);
  const overdue = tasks.filter(t=>t.status!=='completed' && t.due_date && t.due_date<todayISO());
  const open = tasks.filter(t=>t.status!=='completed');
  const kpi=(l,val,sub,c)=>`<div class="kpi" style="--k:${c}"><div class="kpi-label">${l}</div><div class="kpi-value">${val}</div>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`;

  el.innerHTML = `<div class="stack">
    <div class="card card-pad">
      <div class="eyebrow" style="margin-bottom:9px">${T('progress')}</div>
      ${runway(h.actual_progress, h.planned_progress)}
    </div>
    <div class="kpis">
      ${kpi(T('remainingDays'), h.remaining_days==null?'—':h.remaining_days, p.end_date?fmtDate(p.end_date):'', h.remaining_days!=null&&h.remaining_days<0?'var(--rose-600)':'var(--teal-600)')}
      ${kpi(T('openTasks'), open.length, `${tasks.length} ${T('all')}`, 'var(--violet-500)')}
      ${kpi(T('tasksOverdue'), overdue.length,'', 'var(--rose-600)')}
      ${kpi(T('budget'), p.budget?fmtMoney(p.budget,p.currency||'SAR'):'—','','var(--green-600)')}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="dash-grid">
      <div class="card">
        <div class="card-head"><h3>${T('milestones')}</h3></div>
        <div class="card-pad">${ms.length?ms.slice(0,6).map(m=>`
          <div class="list-item"><div class="li-main"><div class="li-title">◆ ${esc(m.title)}</div>
            <div class="li-sub">${fmtDate(m.due_date)}</div></div>${badge(m.status)}</div>`).join('')
          :`<p class="muted tiny" style="text-align:center;padding:14px 0">${T('noMilestones')}</p>`}</div>
      </div>
      <div class="card">
        <div class="card-head"><h3>${T('upcomingMeetings')}</h3></div>
        <div class="card-pad">${meets.length?meets.map(m=>`
          <div class="list-item"><div class="li-main"><div class="li-title">${esc(m.title)}</div>
            <div class="li-sub">${fmtDate(m.meeting_date)}${m.start_time?` · ${m.start_time.slice(0,5)}`:''}${m.location?` · ${esc(m.location)}`:''}</div></div></div>`).join('')
          :`<p class="muted tiny" style="text-align:center;padding:14px 0">${T('noMeetings')}</p>`}</div>
      </div>
    </div>

    tb.innerHTML=`<div class="card"><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>${T('taskName')}</th><th>${T('phase')}</th><th>${T('assignee')}</th>
      <th>${T('dueDate')}</th><th>${T('status')}</th><th style="width:130px">${T('progress')}</th><th></th></tr></thead>
      <tbody>${tasks.map(t=>{
        const late = t.status!=='completed' && t.due_date && t.due_date<todayISO();
        return `<tr data-task="${t.id}" style="cursor:pointer">
          <td class="cell-strong"><span class="pri-dot" style="background:${PRI_COLOR[t.priority]};display:inline-block;margin-inline-end:7px"></span>${esc(t.title)}</td>
          <td class="tiny muted">${esc(phMap[t.phase_id]||'—')}</td>
          <td class="tiny">${esc(t.assignee||'—')}</td>
          <td class="tiny ${late?'':''}" style="${late?'color:var(--rose-600);font-weight:500':''}">${fmtDate(t.due_date)}</td>
          <td>${badge(t.status)}</td>
          <td><div class="row" style="gap:8px"><div class="bar" style="flex:1"><i style="width:${t.progress}%"></i></div>

    e.stopPropagation();
    Modal.confirm(T('confirmDelete'),T('confirmDeleteBody'), async ()=>{
      await DB.remove('tasks',b.dataset.del); toast(T('deletedOk'),'ok'); render();
    });

async function taskDetail(id, p, phases){

  const drawChecklist = list => list.map(c=>`
    <div class="chk ${c.is_done?'done':''}" data-chk="${c.id}">
      <input type="checkbox" ${c.is_done?'checked':''}>
      <div class="chk-text">${esc(c.text)}</div>
      <button class="btn btn-ghost btn-sm" data-chkdel="${c.id}">✕</button>
    </div>`).join('');

  Modal.open({
    wide:true, title:t.title,
    body:`<div class="row row-wrap" style="margin-bottom:15px;gap:8px">
        ${badge(t.status)}
        <span class="chip"><span class="pri-dot" style="background:${PRI_COLOR[t.priority]}"></span>${T(t.priority)}</span>
        ${t.due_date?`<span class="chip">${T('dueDate')}: ${fmtDate(t.due_date)}</span>`:''}
        ${t.assignee?`<span class="chip">${esc(t.assignee)}</span>`:''}

      </div>

      ${t.description?`<p style="white-space:pre-wrap;margin:0 0 16px">${esc(t.description)}</p>`:''}

      <div id="chkList">${items.length?drawChecklist(items):`<p class="tiny muted" style="padding:8px 0">${T('noData')}</p>`}</div>

        <button class="btn btn-primary" id="chkAdd">${T('add')}</button>
      </div>`,
    footer:`<button class="btn" data-close>${T('close')}</button>
            <button class="btn btn-primary" id="tEdit">${T('edit')}</button>`
  });

  const bind=()=>{
    $$('#chkList [data-chk] input').forEach(cb => cb.onchange = async ()=>{
      const cid=cb.closest('[data-chk]').dataset.chk;
      try{ await DB.update('task_checklist',cid,{is_done:cb.checked}); await reload(); }
      catch(e){ toast(e.message,'err'); }
    });
    $$('#chkList [data-chkdel]').forEach(b => b.onclick = async ()=>{
      try{ await DB.remove('task_checklist',b.dataset.chkdel); await reload(); }catch(e){ toast(e.message,'err'); }
    });
  };
  const reload = async ()=>{
    const [[nt], nl] = await Promise.all([
      DB.select('tasks',`select=progress,status&id=eq.${id}`),
      DB.select('task_checklist',`select=*&task_id=eq.${id}&order=sort_order.asc,created_at.asc`)
    ]);
    $('#chkList').innerHTML = nl.length?drawChecklist(nl):`<p class="tiny muted" style="padding:8px 0">${T('noData')}</p>`;
    bind();

    const txt=val('chkNew'); if(!txt) return;

    }catch(e){ toast(e.message,'err'); }
  };
  $('#chkNew').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#chkAdd').click(); } };
  $('#tEdit').onclick = ()=>{ Modal.close(); setTimeout(()=>taskForm(t,p,phases),120); };
  bind();

/* ---------- TIMELINE / GANTT ---------- */
async function pTimeline(el,p){
  const [tasks, phases, ms] = await Promise.all([
    DB.select('tasks',`select=*&project_id=eq.${p.id}&order=start_date.asc,due_date.asc`),
    DB.select('phases',`select=*&project_id=eq.${p.id}&order=sort_order.asc`),
    DB.select('milestones',`select=*&project_id=eq.${p.id}&order=due_date.asc`)
  ]);
  const dates=[p.start_date,p.end_date,
    ...tasks.flatMap(t=>[t.start_date,t.due_date]),
    ...phases.flatMap(f=>[f.start_date,f.end_date]),
    ...ms.map(m=>m.due_date)].filter(Boolean).sort();

  if(!dates.length){ el.innerHTML=emptyState(T('noData'),T('noTasksBody')); return; }
  let min=dates[0], max=dates[dates.length-1];
  if(daysBetween(min,max)<14) max=addDays(min,14);
  min=addDays(min,-3); max=addDays(max,3);
  const span=Math.max(1,daysBetween(min,max));
  const pos=d=>Math.max(0,Math.min(100,(daysBetween(min,d)/span)*100));

  const months=[]; let cur=min.slice(0,7);
  while(cur<=max.slice(0,7)){
    months.push(cur);
    const [y,m]=cur.split('-').map(Number);
    cur = m===12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`;
  }
  const monLabel = ym => new Date(ym+'-01T00:00:00').toLocaleDateString(LANG==='ar'?'ar-SA-u-ca-gregory-nu-latn':'en-GB',{month:'short',year:'2-digit'});

  const bar=(s,e,color,label,prog,extraCls='')=>{
    const st=s||e, en=e||s; if(!st) return '';
    const l=pos(st), w=Math.max(1.2,pos(en)-l);
    return `<div class="g-bar ${extraCls}" style="inset-inline-start:${l}%;width:${w}%;background:${color}" title="${esc(label)}">
      ${prog!=null?`<i class="g-bar-fill" style="width:${prog}%"></i>`:''}<span>${esc(label)}</span></div>`;
  };
  const rows=[];
  phases.forEach(f=>rows.push({label:f.name, bold:true, html:bar(f.start_date,f.end_date,'var(--ink-600)',f.name,null,'g-phase')}));
  tasks.forEach(t=>rows.push({label:t.title, html:bar(t.start_date,t.due_date,
      t.status==='completed'?'var(--green-600)':t.status==='blocked'?'var(--rose-600)':'var(--teal-600)',
      t.title,t.progress)}));
  ms.forEach(m=>{ if(m.due_date) rows.push({label:'◆ '+m.title, html:`<div class="g-ms" style="inset-inline-start:calc(${pos(m.due_date)}% - 9px)" title="${esc(m.title)}"></div>`}); });

  const todayPos = todayISO()>=min && todayISO()<=max ? pos(todayISO()) : null;

  el.innerHTML=`<div class="stack">
    <div class="row row-wrap tiny muted" style="gap:14px">
      <span><i style="display:inline-block;width:11px;height:8px;background:var(--ink-600);border-radius:2px"></i> ${T('phase')}</span>
      <span><i style="display:inline-block;width:11px;height:8px;background:var(--teal-600);border-radius:2px"></i> ${T('tasks')}</span>
      <span><i style="display:inline-block;width:9px;height:9px;background:var(--violet-500);transform:rotate(45deg)"></i> ${T('milestones')}</span>
      <span><i style="display:inline-block;width:2px;height:11px;background:var(--rose-600)"></i> ${T('today')}</span>
      <div class="spacer"></div>
      <button class="btn btn-sm" id="gAddMs">+ ${T('newMilestone')}</button>
    </div>
    <div class="gantt"><div class="gantt-inner">
      <div class="g-head"><div class="g-label-col">${T('taskName')}</div>
        <div class="g-scale">${months.map(m=>`<div class="g-tick">${monLabel(m)}</div>`).join('')}</div></div>
      ${rows.map(r=>`<div class="g-row">
        <div class="g-label" style="${r.bold?'font-weight:600':''}"><span>${esc(r.label)}</span></div>
        <div class="g-lane">
          <div class="g-grid">${months.map(()=>'<i></i>').join('')}</div>
          ${todayPos!=null?`<div class="g-today" style="inset-inline-start:${todayPos}%"></div>`:''}
          ${r.html}
        </div></div>`).join('')}
    </div></div>
  </div>`;
  $('#gAddMs').onclick=()=>milestoneForm(null,p);
}

async function meetingDetail(id,p){

    body:`<div class="row row-wrap" style="gap:8px;margin-bottom:14px">
        ${badge(m.status)}<span class="chip">${fmtDate(m.meeting_date)}</span>
        ${m.start_time?`<span class="chip num">${m.start_time.slice(0,5)}${m.end_time?'–'+m.end_time.slice(0,5):''}</span>`:''}
        ${m.location?`<span class="chip">${esc(m.location)}</span>`:''}

      ${m.participants?`<div style="margin-bottom:12px"><div class="eyebrow">${T('participants')}</div>${esc(m.participants)}</div>`:''}
      ${m.description?`<p style="white-space:pre-wrap">${esc(m.description)}</p>`:''}
      ${m.notes?`<div style="margin:12px 0"><div class="eyebrow">${T('notes')}</div><p style="white-space:pre-wrap;margin:4px 0 0">${esc(m.notes)}</p></div>`:''}
      <div class="divider"></div>
      <div class="eyebrow" style="margin-bottom:6px">${T('actionItems')}</div>
      <div id="aiList">${items.length?drawAI(items):`<p class="tiny muted" style="padding:8px 0">${T('noData')}</p>`}</div>
      <div class="row" style="margin-top:10px">
        <input class="inp" id="aiNew" placeholder="${T('addActionItem')}">
        <input class="inp" id="aiDue" type="date" style="max-width:150px">
        <button class="btn btn-primary" id="aiAdd">${T('add')}</button></div>`,
    footer:`<button class="btn" data-close>${T('close')}</button><button class="btn btn-primary" id="mtEdit">${T('edit')}</button>`});

  const reload=async()=>{
    const nl=await DB.select('meeting_action_items',`select=*&meeting_id=eq.${id}&order=created_at.asc`);
    $('#aiList').innerHTML = nl.length?drawAI(nl):`<p class="tiny muted" style="padding:8px 0">${T('noData')}</p>`; bind();
  };
  const bind=()=>{
    $$('#aiList [data-ai] input').forEach(cb=>cb.onchange=async()=>{
      try{ await DB.update('meeting_action_items',cb.closest('[data-ai]').dataset.ai,{is_done:cb.checked}); await reload(); }catch(e){toast(e.message,'err');}});
    $$('#aiList [data-aidel]').forEach(b=>b.onclick=async()=>{
      try{ await DB.remove('meeting_action_items',b.dataset.aidel); await reload(); }catch(e){toast(e.message,'err');}});
    $$('#aiList [data-conv]').forEach(b=>b.onclick=async()=>{
      const item=(await DB.select('meeting_action_items',`select=*&id=eq.${b.dataset.conv}`))[0];
      try{
        const nt=await DB.insert('tasks',{owner_id:S.profile.id,project_id:p.id,title:item.text,
          assignee:item.assignee,due_date:item.due_date,status:'todo',
          description:`${T('meeting')}: ${m.title}`});
        await DB.update('meeting_action_items',item.id,{converted_task_id:nt.id});
        await logActivity('task','created',`${T('convertToTask')}: ${item.text}`,p.id,nt.id);
        toast(T('savedOk'),'ok'); await reload();
      }catch(e){ toast(e.message,'err'); }
    });
  };
  $('#aiAdd').onclick=async()=>{
    const txt=val('aiNew'); if(!txt) return;
    try{ await DB.insert('meeting_action_items',{owner_id:S.profile.id,meeting_id:id,text:txt,due_date:valOrNull('aiDue')});
      $('#aiNew').value=''; $('#aiDue').value=''; await reload(); }catch(e){toast(e.message,'err');}
  };
  $('#aiNew').onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();$('#aiAdd').click();} };
  $('#mtEdit').onclick=()=>{ Modal.close(); setTimeout(()=>meetingForm(m,p),120); };
  bind();
}

/* ===================== CALENDAR ===================== */
VIEWS.calendar = async (v)=>{
  const base = S.cache.calMonth ? new Date(S.cache.calMonth+'-01T00:00:00') : new Date();
  const y=base.getFullYear(), m=base.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const from=new Date(y,m,1-first.getDay()).toISOString().slice(0,10);
  const to=new Date(y,m+1,6-last.getDay()).toISOString().slice(0,10);

  const [tasks, meets, ms, rems] = await Promise.all([
    DB.select('tasks',`select=id,title,due_date,status,project_id&due_date=gte.${from}&due_date=lte.${to}`),
    DB.select('meetings',`select=id,title,meeting_date,start_time&meeting_date=gte.${from}&meeting_date=lte.${to}`),
    DB.select('milestones',`select=id,title,due_date&due_date=gte.${from}&due_date=lte.${to}`),
    DB.select('reminders',`select=id,title,remind_at&remind_at=gte.${from}&remind_at=lte.${to}T23:59:59`)
  ]);
  const evts={};
  const push=(d,html)=>{ if(!d) return; (evts[d.slice(0,10)] ||= []).push(html); };
  tasks.forEach(t=>push(t.due_date,`<div class="cal-ev" style="background:var(--teal-050);color:var(--teal-600)" title="${esc(t.title)}">▸ ${esc(t.title)}</div>`));
  meets.forEach(x=>push(x.meeting_date,`<div class="cal-ev" style="background:var(--violet-050);color:var(--violet-500)" title="${esc(x.title)}">● ${x.start_time?x.start_time.slice(0,5)+' ':''}${esc(x.title)}</div>`));
  ms.forEach(x=>push(x.due_date,`<div class="cal-ev" style="background:var(--amber-050);color:var(--amber-500)" title="${esc(x.title)}">◆ ${esc(x.title)}</div>`));
  rems.forEach(x=>push(x.remind_at,`<div class="cal-ev" style="background:var(--rose-050);color:var(--rose-600)" title="${esc(x.title)}">🔔 ${esc(x.title)}</div>`));

  const dows = LANG==='ar' ? ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells='', d=new Date(from+'T00:00:00'), endD=new Date(to+'T00:00:00');
  while(d<=endD){
    const iso=d.toISOString().slice(0,10);
    const out = d.getMonth()!==m;
    const isToday = iso===todayISO();
    cells+=`<div class="cal-day ${out?'out':''} ${isToday?'today':''}">
      <div class="cal-num">${d.getDate()}</div>${(evts[iso]||[]).slice(0,4).join('')}
      ${(evts[iso]||[]).length>4?`<div class="tiny muted">+${evts[iso].length-4}</div>`:''}</div>`;
    d.setDate(d.getDate()+1);
  }
  const monthLabel = first.toLocaleDateString(LANG==='ar'?'ar-SA-u-ca-gregory-nu-latn':'en-GB',{month:'long',year:'numeric'});

  v.innerHTML=`<div class="stack">
    <div class="row">
      <button class="btn btn-sm btn-icon" id="calPrev">‹</button>
      <h2 style="min-width:170px;text-align:center">${monthLabel}</h2>
      <button class="btn btn-sm btn-icon" id="calNext">›</button>
      <button class="btn btn-sm" id="calToday">${T('today')}</button>
      <div class="spacer"></div>
      <div class="row row-wrap tiny muted" style="gap:11px">
        <span style="color:var(--teal-600)">▸ ${T('tasks')}</span>
        <span style="color:var(--violet-500)">● ${T('meetings')}</span>
        <span style="color:var(--amber-500)">◆ ${T('milestones')}</span>
        <span style="color:var(--rose-600)">🔔 ${T('reminders')}</span>
      </div>
    </div>
    <div class="cal">${dows.map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
  </div>`;
  const setMonth=(dy)=>{ const nd=new Date(y,m+dy,1); S.cache.calMonth=nd.toISOString().slice(0,7); render(); };
  $('#calPrev').onclick=()=>setMonth(-1); $('#calNext').onclick=()=>setMonth(1);
  $('#calToday').onclick=()=>{ S.cache.calMonth=null; render(); };
};

  $$('[data-rdel]').forEach(b=>b.onclick=()=>Modal.confirm(T('confirmDelete'),T('confirmDeleteBody'),
    async()=>{await DB.remove('reminders',b.dataset.rdel);toast(T('deletedOk'),'ok');render();}));

        <div style="min-width:150px">${field('rpFrom',T('startDate'),'date',addDays(todayISO(),-30))}</div>
        <div style="min-width:150px">${field('rpTo',T('endDate'),'date',todayISO())}</div>
        <button class="btn btn-primary" id="rpGo" style="margin-bottom:15px">${T('generateReport')}</button>
      </div>
    </div>

  </div>`;

};

async function buildReport(type, projectId, from, to){
  const out=$('#rpOut'); out.innerHTML='<div class="loading"><div class="spin"></div></div>';
  const pf = projectId ? `&project_id=eq.${projectId}` : '';
  const [projects, tasks, ms, health] = await Promise.all([
    DB.select('projects',`select=*&is_archived=eq.false${projectId?`&id=eq.${projectId}`:''}`),
    DB.select('tasks',`select=*${pf}&limit=1000`),
    DB.select('milestones',`select=*${pf}`),
    DB.select('v_project_health','select=*')
  ]);
  const hMap=Object.fromEntries(health.map(h=>[h.project_id,h]));
  const pMap=Object.fromEntries(projects.map(p=>[p.id,p.name]));
  const title = REPORT_TYPES().find(r=>r.v===type)?.t || '';
  let head=[], rows=[];

  if(type==='status'||type==='performance'){
    head=[T('project'),T('status'),T('plannedProgress'),T('actualProgress'),T('variance'),T('openTasks'),T('tasksOverdue'),T('health')];
    rows=projects.map(p=>{ const h=hMap[p.id]||{};
      return [p.name,T(p.status),(h.planned_progress??'—')+'%',(h.actual_progress??0)+'%',
        (h.variance>0?'+':'')+(h.variance??0),h.open_tasks??0,h.overdue_tasks??0,
        h.health==='on_track'?T('onTrack'):h.health==='delayed'?T('delayed'):T('atRisk')]; });
  } else if(type==='weekly'){
    const since=from||addDays(todayISO(),-7);
    head=[T('project'),T('completed'),T('openTasks'),T('tasksOverdue'),T('actualProgress')];
    rows=projects.map(p=>{ const ts=tasks.filter(t=>t.project_id===p.id); const h=hMap[p.id]||{};
      return [p.name, ts.filter(t=>t.status==='completed'&&t.completed_at&&t.completed_at>=since).length,
        ts.filter(t=>t.status!=='completed').length,
        ts.filter(t=>t.status!=='completed'&&t.due_date&&t.due_date<todayISO()).length,
        (h.actual_progress??0)+'%']; });
  } else if(type==='tasks'||type==='overdue'){
    let ts=tasks;
    if(type==='overdue') ts=tasks.filter(t=>t.status!=='completed'&&t.due_date&&t.due_date<todayISO());
    if(from) ts=ts.filter(t=>!t.due_date||t.due_date>=from);
    if(to)   ts=ts.filter(t=>!t.due_date||t.due_date<=to);
    head=[T('taskName'),T('project'),T('assignee'),T('dueDate'),T('status'),T('priority'),T('progress')];
    rows=ts.map(t=>[t.title,pMap[t.project_id]||'—',t.assignee||'—',t.due_date||'—',T(t.status),T(t.priority),t.progress+'%']);
  } else if(type==='milestones'){
    head=[T('milestoneTitle'),T('project'),T('dueDate'),T('status')];
    rows=ms.map(m=>[m.title,pMap[m.project_id]||'—',m.due_date||'—',T(m.status)]);
  }

  out.innerHTML=`<div class="card">
    <div class="card-head"><h2>${esc(title)}</h2>
      <span class="tiny muted">${fmtDate(from)} — ${fmtDate(to)}</span>
      <button class="btn btn-sm" id="rpCsv">${T('exportCsv')}</button>
      <button class="btn btn-sm" onclick="window.print()">${T('print')}</button></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===0?'cell-strong':'tiny'}">${esc(c)}</td>`).join('')}</tr>`).join('')
        :`<tr><td colspan="${head.length}" class="muted" style="text-align:center;padding:26px">${T('noData')}</td></tr>`}</tbody>
    </table></div></div>`;

  $('#rpCsv').onclick=()=>{
    const csv='\uFEFF'+[head,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=`${type}-${todayISO()}.csv`; a.click();
  };
  try{ await DB.insert('reports',{owner_id:S.profile.id,project_id:projectId||null,report_type:type,
    title,period_start:from||null,period_end:to||null,content:{rows:rows.length}}); }catch(_){}
}

/* ===================== AI ASSISTANT ===================== */
const AI = {
  history: JSON.parse(localStorage.getItem('kayan_ai')||'[]'),
  open(){ $('#aiPanel').classList.add('on'); this.draw(); setTimeout(()=>$('#aiInput').focus(),80); },
  close(){ $('#aiPanel').classList.remove('on'); },
  clear(){ this.history=[]; localStorage.removeItem('kayan_ai'); this.draw(); },
  save(){ localStorage.setItem('kayan_ai',JSON.stringify(this.history.slice(-20))); },
  draw(){
    const b=$('#aiBody');
    if(!this.history.length){
      b.innerHTML=`<div class="ai-msg a">${T('aiWelcome')}</div>
        <div class="ai-suggest">${['aiQ1','aiQ2','aiQ3','aiQ4'].map(k=>`<button data-q="${T(k)}">${T(k)}</button>`).join('')}</div>`;
      b.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{ $('#aiInput').value=x.dataset.q; AI.send(); });
    } else {
      b.innerHTML=this.history.map(m=>`<div class="ai-msg ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('');
    }
    b.scrollTop=b.scrollHeight;
  },
  async context(){
    const [d, health, projects, tasks, ms] = await Promise.all([
      DB.rpc('dashboard_summary'),
      DB.select('v_project_health','select=*'),
      DB.select('projects','select=id,name,status,start_date,end_date,priority,client&is_archived=eq.false'),
      DB.select('tasks','select=id,project_id,title,status,due_date,priority,progress,assignee&status=neq.completed&limit=150'),
      DB.select('milestones','select=project_id,title,due_date,status&status=eq.pending')
    ]);
    const hMap=Object.fromEntries(health.map(h=>[h.project_id,h]));
    return {
      today: todayISO(),
      summary: d,
      projects: projects.map(p=>({...p, ...(hMap[p.id]||{})})),
      open_tasks: tasks,
      pending_milestones: ms
    };
  },
  async send(){
    const q=$('#aiInput').value.trim(); if(!q) return;
    $('#aiInput').value='';
    this.history.push({role:'user',content:q}); this.save(); this.draw();
    const b=$('#aiBody');
    const think=document.createElement('div');
    think.className='ai-msg a'; think.textContent=T('aiThinking');
    b.appendChild(think); b.scrollTop=b.scrollHeight;
    try{
      const ctx=await this.context();
      const r=await fetch(CFG.AI_FN,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question:q, lang:LANG, context:ctx, history:this.history.slice(-8,-1)})});
      if(!r.ok) throw new Error(r.status===404?T('aiOffline'):`AI error ${r.status}`);
      const d=await r.json();
      const answer=d.answer || d.text || T('aiOffline');
      think.remove();
      this.history.push({role:'assistant',content:answer}); this.save(); this.draw();
      try{ await DB.insert('ai_conversations',{owner_id:S.profile.id,role:'user',content:q});
           await DB.insert('ai_conversations',{owner_id:S.profile.id,role:'assistant',content:answer}); }catch(_){}
    }catch(e){
      think.remove();
      this.history.push({role:'assistant',content:e.message||T('aiOffline')}); this.save(); this.draw();
    }
  }
};

/* ===================== AUTH SCREEN LOGIC ===================== */
let authMode='signin';
function renderAuthTexts(){
  const t=$('#authTitle'); if(!t) return;
  t.textContent = authMode==='signin'?T('signInTitle'):T('signUpTitle');
  $('#authSub').textContent = authMode==='signin'?T('signInSub'):T('signUpSub');
  $('#authSubmit').textContent = authMode==='signin'?T('signIn'):T('signUp');
  $('#authNote').textContent = authMode==='signin'?T('authNoteIn'):T('authNoteUp');
  $('#signupOnly').style.display = authMode==='signup'?'':'none';
  $('#fPassConfirm').style.display = authMode==='signup'?'':'none';
  $('#fIdentifier').style.display = authMode==='signin'?'':'none';
  $('#lblIdentifier').textContent = T('emailOrUsername');
  $('#iIdentifier').required = authMode==='signin';
  $('#iEmail').required = authMode==='signup';
  $('#iPass').autocomplete = authMode==='signin'?'current-password':'new-password';
}
$$('.auth-toggle button').forEach(b=>b.onclick=()=>{
  authMode=b.dataset.mode;
  $$('.auth-toggle button').forEach(x=>x.classList.toggle('on',x===b));
  renderAuthTexts();
});
$('#authForm').onsubmit = async e=>{
  e.preventDefault();
  const btn=$('#authSubmit'), pass=$('#iPass').value;
  if(pass.length<8) return toast(T('authNoteIn'),'err');
  btn.disabled=true; const old=btn.textContent; btn.textContent='…';

  try{
    if(authMode==='signup'){
      const email=val('iEmail'), confirm=$('#iPassConfirm').value;
      if(!email) return fail(T('requiredField'));
      if(pass!==confirm) return fail(T('passwordMismatch'));
      const first=val('iFirst'), last=val('iLast');
      const fullName = [first,last].filter(Boolean).join(' ') || email.split('@')[0];

      await Auth.signUp(email, pass, fullName);
      // Establish the profile row, then attach the extra sign-up fields.
      await DB.rpc('bootstrap_profile',{p_email:email, p_name:fullName});
      try{
        await DB.rpc('set_signup_details',{
          p_first: first||null, p_last: last||null,
          p_username: valOrNull('iUsername'), p_phone: valOrNull('iPhone')
        });
      }catch(de){
        const msg = /username_taken/.test(de.message) ? T('usernameTaken')
                  : /phone_taken/.test(de.message) ? T('phoneTaken') : de.message;
        toast(msg,'err'); // account still created; user can fix these later in Settings
      }
    } else {
      let email = val('iIdentifier');
      if(!email.includes('@')){
        const resolved = await DB.rpcAnon('lookup_login_identifier',{p_identifier:email});
        if(!resolved) return fail(T('identifierNotFound'));
        email = resolved;
      }
      await Auth.signIn(email, pass);
    }
    await boot();
  }catch(err){ fail(err.message); }

  function fail(msg){ toast(msg,'err'); btn.disabled=false; btn.textContent=old; }
};
$('#authLangBtn').onclick=()=>setLang(LANG==='ar'?'en':'ar',false);
$('#authThemeBtn').onclick=toggleTheme;
$('#pendingRecheck').onclick=()=>boot();
$('#pendingOut').onclick=doSignOut;

async function doSignOut(){ await Auth.signOut(); S.profile=null; location.hash=''; showAuth(); }
function showAuth(pending=false){
  $('#appScreen').classList.remove('on');
  $('#aiFab').classList.add('hide');
  $('#authScreen').style.display='grid';
  $('#authCard').classList.toggle('hide',pending);
  $('#pendingCard').classList.toggle('hide',!pending);
  const b=$('#authSubmit'); if(b){ b.disabled=false; renderAuthTexts(); }
}
function paintUser(){
  const p=S.profile; if(!p) return;
  $('#sbAvatar').textContent=initials(p.full_name||p.email);
  $('#sbName').textContent=p.full_name||p.email;
  $('#sbRole').textContent=p.is_admin?'Admin':(p.job_title||T('projects'));
}

/* ===================== BOOT ===================== */
async function boot(){
  const s=await Auth.getSession();
  if(!s?.user){ showAuth(); return; }
  let prof;
  try{
    prof = await DB.rpc('bootstrap_profile',{p_email:s.user.email, p_name:s.user.name||''});
    if(Array.isArray(prof)) prof=prof[0];
  }catch(e){ toast(e.message,'err'); showAuth(); return; }

  if(!prof || prof.status!=='active'){ showAuth(true); return; }
  S.profile=prof;
  if(prof.lang && prof.lang!==LANG){ LANG=prof.lang; localStorage.setItem('kayan_lang',LANG); }
  if(prof.theme) applyTheme(prof.theme);
  applyLang();

  $('#authScreen').style.display='none';
  $('#appScreen').classList.add('on');
  $('#aiFab').classList.remove('hide');
  paintUser();
  parseHash();

  try{
    await DB.rpc('generate_notifications');
    const n=await DB.select('notifications','select=id&is_read=eq.false&limit=200');
    S.notifCount=n.length;
  }catch(_){}
  render();
}

applyLang();
boot();
